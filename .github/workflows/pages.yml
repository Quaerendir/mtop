name: pages

# Static site from site/ -> GitHub Pages. One-time setup on GitHub:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The images live in docs/ (tools/screenshot.py writes them there); they are
# copied next to index.html at deploy time so the two never drift.

on:
  push:
    branches: [master]
    paths: ["site/**", "docs/*.png", "docs/*.gif", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: cp docs/screenshot.png docs/screenshot-llama-swap.png docs/screenshot-comfyui.png docs/demo-control.gif site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
