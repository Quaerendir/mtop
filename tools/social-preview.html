<!DOCTYPE html>
<!--
  Source of docs/social-preview.png (1280x640, GitHub "Social preview" and og:image).
  Regenerate after refreshing docs/screenshot.png (Chrome/Chromium needed):

    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1280,640 --allow-file-access-from-files \
      --screenshot=docs/social-preview.png file://$PWD/tools/social-preview.html

  GitHub's social preview itself is uploaded by hand: Settings -> Social preview.
-->
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: #1b1d2b; }
  body { position: relative; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #d6d9e8; }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brand { font-size: 34px; font-weight: 700; color: #9be8a6; margin-bottom: 26px; }
  h1 { font-size: 66px; line-height: 1.08; font-weight: 800; letter-spacing: -1.5px; }
  .g { color: #9be8a6; } .p { color: #f5a0d0; }
  .sub { margin-top: 28px; font-size: 24px; color: #8b90a8; line-height: 1.5; }
  .sub b { color: #d6d9e8; font-weight: 600; }
  .cmd { margin-top: 36px; align-self: flex-start; background: #232637; border: 1px solid #34384d; border-radius: 10px; padding: 14px 20px; font-size: 24px; }
  .cmd span { color: #8b90a8; }
  .url { position: absolute; left: 72px; bottom: 44px; font-size: 22px; color: #7fdcc4; }
  .shot { position: absolute; left: 690px; top: 70px; width: 740px; height: 500px; border-radius: 14px; border: 1px solid #34384d;
          box-shadow: 0 24px 70px rgba(0,0,0,.55); overflow: hidden; background: #1b1d2b; }
  .shot img { position: absolute; left: 0; top: 0; width: 1080px; height: auto; }
</style></head>
<body>
  <div class="left">
    <div class="brand">mtop</div>
    <h1><span class="g">htop</span> for local <span class="p">AI inference</span></h1>
    <div class="sub"><b>Ollama</b> · <b>llama-swap / vLLM</b> · <b>ComfyUI</b><br>models, GPU and server at a glance</div>
    <div class="cmd"><span>$</span> pipx install ollama-mtop</div>
  </div>
  <div class="url">mtop.quaerendir.net</div>
  <div class="shot"><img src="../docs/screenshot.png"></div>
</body></html>
